name: CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  DOTNET_NET8_VERSION: '8.0.x'
  DOTNET_NET10_VERSION: '10.0.x'
# Cancel in‑progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_NET8_VERSION }}
            ${{ env.DOTNET_NET10_VERSION }}
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./Source
      - name: Build
        run: dotnet build --no-restore --configuration ${{ matrix.configuration }}
        working-directory: ./Source
      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration ${{ matrix.configuration }} --collect:"XPlat Code Coverage" --results-directory ../coverage/${{ matrix.configuration }}
        working-directory: ./Tests
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.configuration == 'Release'
        with:
          directory: ./coverage/Release/
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: ./coverage/${{ matrix.configuration }}/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_NET8_VERSION }}
            ${{ env.DOTNET_NET10_VERSION }}
      - name: Restore dependencies
        run: dotnet restore --verbosity normal
        working-directory: ./Source
      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable
        working-directory: ./Source
      - name: Check for outdated packages
        run: dotnet list package --outdated
        working-directory: ./Source
      - name: Generate dependency report
        run: |
          echo "## Dependency Analysis Report" > dependency-report.md
          echo "" >> dependency-report.md
          echo "### Vulnerable Packages:" >> dependency-report.md
          dotnet list package --vulnerable >> dependency-report.md 2>&1 || echo "No vulnerable packages found" >> dependency-report.md
          echo "" >> dependency-report.md
          echo "### Outdated Packages:" >> dependency-report.md
          dotnet list package --outdated >> dependency-report.md 2>&1 || echo "No outdated packages found" >> dependency-report.md
        working-directory: ./Source
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: ./Source/dependency-report.md

  release:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    # Only run release when PR is merged into main (push to main after PR merge)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_NET8_VERSION }}
            ${{ env.DOTNET_NET10_VERSION }}

      - name: Get latest version tagss
        id: get_version
        run: |
          # net8: find the latest 8.0.x tag and increment patch
          LATEST_NET8=$(git tag -l | grep -E '^8\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LATEST_NET8" ]; then
            NET8_VERSION="8.0.0"
          else
            PATCH=$(echo $LATEST_NET8 | cut -d'.' -f3)
            NET8_VERSION="8.0.$((PATCH + 1))"
          fi

          # net10: find the latest 10.0.x tag and increment patch
          LATEST_NET10=$(git tag -l | grep -E '^10\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LATEST_NET10" ]; then
            NET10_VERSION="10.0.0"
          else
            PATCH=$(echo $LATEST_NET10 | cut -d'.' -f3)
            NET10_VERSION="10.0.$((PATCH + 1))"
          fi

          echo "net8_version=$NET8_VERSION" >> $GITHUB_OUTPUT
          echo "net10_version=$NET10_VERSION" >> $GITHUB_OUTPUT
          echo "Net8 version: $NET8_VERSION"
          echo "Net10 version: $NET10_VERSION"

      - name: Create and push Git tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_version.outputs.net8_version }}
          git tag ${{ steps.get_version.outputs.net10_version }}
          git push origin ${{ steps.get_version.outputs.net8_version }}
          git push origin ${{ steps.get_version.outputs.net10_version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./Source

      - name: Clean workspace of existing packages
        run: |
          # Remove any existing packages in the output directory
          mkdir -p ./nuget-packages
          rm -f ./nuget-packages/*.nupkg
          
          # Clean any test packages anywhere in the source tree
          find . \( -name "*.nupkg" -o -name "*.snupkg" \) -type f -delete
          
          # Remove any test-nuget-packages directory to prevent it from being included
          find . -type d -name "test-nuget-packages" -exec rm -rf {} +
      
      - name: Pack NuGet packages
        run: |
          # Pack net8.0 with 8.0.x versioning (includes native binaries)
          dotnet pack ./Source/EnergyExemplar.EFCore.Duckdb.Extensions.csproj \
            --no-restore \
            --configuration Release \
            --framework net8.0 \
            --output ./nuget-packages \
            /p:Version=${{ steps.get_version.outputs.net8_version }} \
            /p:FileVersion=${{ steps.get_version.outputs.net8_version }}.1 \
            /p:AssemblyVersion=${{ steps.get_version.outputs.net8_version }}.1 \
            /p:IsPackable=true \
            /p:IncludeSymbols=true \
            /p:NoWarn=NU5105

          # Pack net10.0 with 10.0.x versioning (binaries supplied by consumer)
          dotnet pack ./Source/EnergyExemplar.EFCore.Duckdb.Extensions.csproj \
            --no-restore \
            --configuration Release \
            --framework net10.0 \
            --output ./nuget-packages \
            /p:Version=${{ steps.get_version.outputs.net10_version }} \
            /p:FileVersion=${{ steps.get_version.outputs.net10_version }}.1 \
            /p:AssemblyVersion=${{ steps.get_version.outputs.net10_version }}.1 \
            /p:IsPackable=true \
            /p:IncludeSymbols=true \
            /p:NoWarn=NU5105

          # Extra safety: remove any test packages that might have been created
          find ./nuget-packages \( -name "*test*.nupkg" -o -name "*.Test*.nupkg" -o -name "*.Tests*.nupkg" \) -type f -delete

      - name: Verify no test packages were created
        run: |
          # Check for any test packages and fail if found
          TEST_PACKAGES=$(find ./nuget-packages \( -name "*test*.nupkg" -o -name "*.Test*.nupkg" -o -name "*.Tests*.nupkg" \) -type f)
          if [ ! -z "$TEST_PACKAGES" ]; then
            echo "Error: Test packages were detected in the output:"
            echo "$TEST_PACKAGES"
            echo "Test packages should not be included in the release."
            exit 1
          fi
          
          # List all packages for debugging
          echo "All packages in output directory:"
          find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" -type f
          
          # Verify we have the expected net8 and net10 packages
          NET8_PKG="EnergyExemplar.EntityFrameworkCore.DuckDb.${{ steps.get_version.outputs.net8_version }}.nupkg"
          NET10_PKG="EnergyExemplar.EntityFrameworkCore.DuckDb.${{ steps.get_version.outputs.net10_version }}.nupkg"

          if [ ! -f "./nuget-packages/$NET8_PKG" ]; then
            echo "Error: net8 package not found: $NET8_PKG"
            exit 1
          fi
          if [ ! -f "./nuget-packages/$NET10_PKG" ]; then
            echo "Error: net10 package not found: $NET10_PKG"
            exit 1
          fi

          # Count total packages (including symbols)
          PACKAGE_COUNT=$(find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" -type f | wc -l)

          echo "Found $PACKAGE_COUNT package(s) in output directory"
          echo "Net8 package:  $NET8_PKG ✅"
          echo "Net10 package: $NET10_PKG ✅"

          # Allow 2-4 packages (net8 main + net10 main + optional symbols for each)
          if [ "$PACKAGE_COUNT" -lt 2 ] || [ "$PACKAGE_COUNT" -gt 4 ]; then
            echo "Error: Expected 2-4 packages (net8 + net10 main + optional symbols), found $PACKAGE_COUNT"
            exit 1
          fi
          
          echo "✅ Package verification successful - no test packages found"
      
      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nuget-packages/*.nupkg
          if-no-files-found: error  # Make the build fail if no packages are found

      - name: Create artifacts directory
        run: mkdir -p ./artifacts

      - name: Publish application
        run: dotnet publish --no-build --configuration Release --output ../publish/
        working-directory: ./Source

      - name: Create version info file
        run: |
          echo "Version: ${{ steps.get_version.outputs.new_version }}" > ./publish/VERSION.txt
          echo "Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> ./publish/VERSION.txt
          echo "Commit: ${{ github.sha }}" >> ./publish/VERSION.txt
          echo "Branch: ${{ github.ref_name }}" >> ./publish/VERSION.txt

      - name: Create release zip
        run: |
          cd ./publish
          zip -r ../artifacts/EnergyExemplar.EFCore.Duckdb.Extensions-${{ steps.get_version.outputs.new_version }}.zip .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.get_version.outputs.new_version }}
          path: ./artifacts/

      - name: Create GitHub Release with Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.get_version.outputs.new_version }} \
            --title "Release ${{ steps.get_version.outputs.new_version }}" \
            --notes "## Release ${{ steps.get_version.outputs.new_version }}

          ### Changes
          - Automated release from commit ${{ github.sha }}
          - See [CHANGELOG](https://github.com/EnergyExemplar/EnergyExemplar.EFCore.Duckdb.Extensions/commits/${{ steps.get_version.outputs.new_version }}) for details

          ### Download
          The release package is available as a zip file below." \
            ./artifacts/EnergyExemplar.EFCore.Duckdb.Extensions-${{ steps.get_version.outputs.new_version }}.zip
